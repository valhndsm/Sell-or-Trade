<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit for Sale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0a1330;
    --deep-2:#0f1c45;
    --teal:#2fe0c9;
    --gold:#ffb020;
    --purple:#8a5cff;
    --text:#eaf0ff;
    --text-soft:#9fb0e0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(138,92,255,0.25), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(47,224,201,0.18), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(255,176,32,0.10), transparent 45%),
      linear-gradient(180deg, var(--deep) 0%, var(--deep-2) 100%);
    display:flex;align-items:center;justify-content:center;
    padding:28px 16px;
  }

  .wrap{width:100%;max-width:440px;}

  .top-row{display:flex;justify-content:center;align-items:center;margin-bottom:14px;}
  .brand{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;color:var(--text-soft);letter-spacing:0.02em;}
  .brand span{color:var(--teal);}

  .card{
    background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:1px solid rgba(138,92,255,0.35);
    border-radius:22px;
    padding:22px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.03), 0 30px 60px rgba(0,0,0,0.5), 0 0 70px rgba(138,92,255,0.12);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 0%, rgba(47,224,201,0.10), transparent 60%);
    pointer-events:none;
  }

  .photo-frame{
    width:100%;aspect-ratio:1/1;
    border-radius:16px;
    background:radial-gradient(circle at 50% 40%, rgba(255,176,32,0.18), rgba(10,19,48,0.4) 70%);
    border:1px solid rgba(255,255,255,0.1);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    margin-bottom:16px;
    position:relative;
  }
  .photo-frame img{width:100%;height:100%;object-fit:contain;padding:14px;filter:drop-shadow(0 10px 25px rgba(255,176,32,0.35));}
  .sold-stamp{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);
    border:3px solid #ff4d5e;color:#ff4d5e;font-family:'Baloo 2',sans-serif;font-weight:800;
    font-size:26px;letter-spacing:0.08em;padding:4px 16px;border-radius:8px;
    background:rgba(10,19,48,0.6);
  }

  .name{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:26px;
    margin:0 0 6px;line-height:1.15;
    text-shadow:0 0 20px rgba(138,92,255,0.4);
  }
  .price-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .price{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;
    background:linear-gradient(135deg, var(--gold), #ff8a3d);
    color:#241200;padding:6px 12px;border-radius:8px;
  }
  .status-pill{
    font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;
    color:var(--teal);border:1px solid rgba(47,224,201,0.4);padding:4px 10px;border-radius:20px;
  }
  .status-pill.sold{color:#ff8a99;border-color:rgba(255,138,153,0.4);}
  .stock-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;font-weight:600;letter-spacing:0.03em;
    color:var(--gold);border:1px solid rgba(255,176,32,0.4);padding:4px 10px;border-radius:20px;
  }

  .desc{
    font-size:14px;line-height:1.65;color:var(--text-soft);
    white-space:pre-wrap;margin-bottom:18px;
  }

  .contact-stack{display:flex;flex-direction:column;gap:9px;}
  .contact-btn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;padding:13px 16px;border-radius:12px;border:none;
    color:#fff;font-weight:700;font-size:14.5px;font-family:'Inter',sans-serif;
    cursor:pointer;text-decoration:none;
    transition:transform .12s;
  }
  .contact-btn:hover{transform:translateY(-1px);}
  .contact-btn svg{width:18px;height:18px;flex-shrink:0;}
  .fb-btn{background:linear-gradient(135deg,#1877f2,#0e5fd1);box-shadow:0 10px 22px rgba(24,119,242,0.3);}
  .fb-btn svg{fill:#fff;}
  .tiktok-btn{background:linear-gradient(135deg,#25f4ee,#111 45%,#fe2c55);box-shadow:0 10px 22px rgba(0,0,0,0.35);}
  .tiktok-btn svg{fill:#fff;}
  .gmail-btn{background:linear-gradient(135deg,#ea4335,#c5221f);box-shadow:0 10px 22px rgba(234,67,53,0.3);}
  .gmail-btn svg{fill:#fff;}

  .no-contact{
    text-align:center;font-size:12.5px;color:var(--text-soft);
    border:1px dashed rgba(255,255,255,0.2);border-radius:12px;padding:14px;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <div class="brand">FRUIT<span>SHOP</span></div>
  </div>

  <div class="card">
    <div class="photo-frame" id="photoFrame">
      <div class="sold-stamp" id="soldStamp" style="display:none;">SOLD</div>
    </div>
    <h1 class="name" id="fruitName"></h1>
    <div class="price-row">
      <span class="price" id="fruitPrice"></span>
      <span class="status-pill" id="statusPill"></span>
      <span class="stock-pill" id="stockPill" style="display:none;"></span>
    </div>
    <div class="desc" id="fruitDesc"></div>

    <div class="contact-stack" id="contactStack">
      <a class="contact-btn fb-btn" id="fbBtn" href="#" target="_blank" rel="noopener" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>
        Message on Facebook
      </a>
      <a class="contact-btn tiktok-btn" id="tiktokBtn" href="#" target="_blank" rel="noopener" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M16.6 5.2c-.9-.8-1.5-1.9-1.6-3.2h-3.2v13.6c0 1.5-1.2 2.7-2.7 2.7s-2.7-1.2-2.7-2.7 1.2-2.7 2.7-2.7c.3 0 .5 0 .8.1V9.7c-.3 0-.5-.1-.8-.1-3.2 0-5.8 2.6-5.8 5.8s2.6 5.8 5.8 5.8 5.8-2.6 5.8-5.8V9.1c1.2.9 2.7 1.4 4.3 1.4V7.3c-.9 0-1.8-.3-2.6-.8-.1 0-.1-.1-.2-.1z"/></svg>
        Message on TikTok
      </a>
      <a class="contact-btn gmail-btn" id="gmailBtn" href="#" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 2-8 5-8-5h16zM4 18V7.4l8 5 8-5V18H4z"/></svg>
        Email on Gmail
      </a>
      <div class="no-contact" id="noContact" style="display:none;">Seller hasn't added contact info yet.</div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   EDIT YOUR LISTING HERE, then save the file and push to GitHub.
   That's the only step needed — no PIN, no login.
   ============================================================ */
var FRUIT_LISTING = {
  name:  "Sample Fruit — edit me!",
  price: "e.g. 500 Robux",
  stock: 1,                           // how many you have available
  desc:  "Replace this text with your fruit's real stats, level, and trade terms.",

  // Paste a direct image URL here (e.g. an Imgur link), or leave the
  // DEFAULT_PHOTO placeholder below untouched to keep the default art.
  photo: "",

  sold: false,

  // Leave any of these blank ("") to hide that button.
  fb:     "",                         // e.g. "https://facebook.com/yourname"
  tiktok: "",                         // e.g. "@yourname" or full link
  gmail:  ""                          // e.g. "yourname@gmail.com"
};
/* ============================================================ */

(function(){
  var DEFAULT_PHOTO = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
    '<defs><radialGradient id="g1" cx="35%" cy="30%" r="75%">' +
    '<stop offset="0%" stop-color="#ffe08a"/>' +
    '<stop offset="45%" stop-color="#ff8a3d"/>' +
    '<stop offset="100%" stop-color="#8a5cff"/>' +
    '</radialGradient></defs>' +
    '<circle cx="100" cy="108" r="72" fill="url(#g1)"/>' +
    '<path d="M100 30c6 10 4 20-2 26-8-2-14-12-8-26z" fill="#2fe0c9"/>' +
    '<path d="M60 55c14-16 34-18 46-8-2 12-16 24-30 24-8-6-14-10-16-16z" fill="#2fe0c9" opacity="0.85"/>' +
    '<g fill="#ffffff" opacity="0.85">' +
    '<circle cx="78" cy="95" r="4"/><circle cx="102" cy="82" r="4"/><circle cx="126" cy="100" r="4"/>' +
    '<circle cx="90" cy="120" r="4"/><circle cx="118" cy="128" r="4"/><circle cx="100" cy="150" r="4"/>' +
    '<circle cx="70" cy="130" r="4"/><circle cx="132" cy="130" r="4"/>' +
    '</g></svg>'
  );

  function tiktokUrl(val){
    val = (val || "").trim();
    if(!val) return "";
    if(val.indexOf('http') === 0) return val;
    var handle = val.charAt(0) === '@' ? val.slice(1) : val;
    return 'https://www.tiktok.com/@' + handle;
  }

  function render(){
    var f = FRUIT_LISTING;
    document.getElementById('fruitName').textContent = f.name || 'Untitled Fruit';
    document.getElementById('fruitPrice').textContent = f.price || '—';
    document.getElementById('fruitDesc').textContent = f.desc || 'No details yet.';

    var stockNum = (typeof f.stock === 'number') ? f.stock : parseInt(f.stock, 10);
    var isOutOfStock = !isNaN(stockNum) && stockNum <= 0;
    var isSold = !!f.sold || isOutOfStock;

    var pill = document.getElementById('statusPill');
    pill.textContent = isSold ? 'Sold' : 'Available';
    pill.classList.toggle('sold', isSold);
    document.getElementById('soldStamp').style.display = isSold ? 'block' : 'none';

    var stockPill = document.getElementById('stockPill');
    if(!isNaN(stockNum)){
      stockPill.textContent = isSold ? 'Stock: 0' : ('Stock: ' + stockNum + 'x');
      stockPill.style.display = 'inline-block';
    } else {
      stockPill.style.display = 'none';
    }

    var frame = document.getElementById('photoFrame');
    var img = document.createElement('img');
    img.src = f.photo ? f.photo : DEFAULT_PHOTO;
    frame.insertBefore(img, frame.firstChild);

    var fbBtn = document.getElementById('fbBtn');
    var tiktokBtn = document.getElementById('tiktokBtn');
    var gmailBtn = document.getElementById('gmailBtn');
    var noContact = document.getElementById('noContact');

    var anyContact = false;
    if(f.fb){ fbBtn.href = f.fb; fbBtn.style.display = 'flex'; anyContact = true; }
    if(f.tiktok){ tiktokBtn.href = tiktokUrl(f.tiktok); tiktokBtn.style.display = 'flex'; anyContact = true; }
    if(f.gmail){
      var subject = encodeURIComponent('Interested in: ' + (f.name || 'your fruit'));
      var body = encodeURIComponent('Hi, I\'m interested in "' + (f.name || 'this fruit') + '" (' + (f.price || '') + '). Is it still available?');
      gmailBtn.href = 'mailto:' + f.gmail + '?subject=' + subject + '&body=' + body;
      gmailBtn.style.display = 'flex';
      anyContact = true;
    }
    noContact.style.display = anyContact ? 'none' : 'block';
  }

  render();
})();
</script>
</body>
</html>
