<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BloxMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0a1330;
    --deep-2:#0f1c45;
    --panel:#121c47;
    --teal:#2fe0c9;
    --gold:#ffb020;
    --purple:#8a5cff;
    --text:#eaf0ff;
    --text-soft:#9fb0e0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(138,92,255,0.22), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(47,224,201,0.16), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(255,176,32,0.10), transparent 45%),
      linear-gradient(180deg, var(--deep) 0%, var(--deep-2) 100%);
    padding:32px 18px 60px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  header{text-align:center;margin-bottom:24px;}
  .brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:32px;letter-spacing:-0.01em;}
  .brand span{color:var(--teal);}
  .tagline{color:var(--text-soft);font-size:13.5px;margin-top:6px;}

  .search-row{
    max-width:420px;margin:22px auto 30px;position:relative;
  }
  .search-row svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;fill:var(--text-soft);pointer-events:none;
  }
  .search-row input{
    width:100%;padding:12px 14px 12px 40px;border-radius:12px;
    border:1px solid rgba(138,92,255,0.35);
    background:rgba(255,255,255,0.05);color:var(--text);
    font-family:'Inter',sans-serif;font-size:14px;
  }
  .search-row input::placeholder{color:var(--text-soft);}
  .search-row input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .search-count{
    text-align:center;color:var(--text-soft);font-size:12px;margin:-22px 0 22px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px,1fr));
    gap:20px;
  }
  .empty{
    text-align:center;color:var(--text-soft);font-family:'Baloo 2',sans-serif;
    font-size:18px;padding:60px 20px;
  }

  .card{
    background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:1px solid rgba(138,92,255,0.3);
    border-radius:18px;
    padding:14px;
    cursor:pointer;
    box-shadow:0 14px 28px rgba(0,0,0,0.4);
    transition:transform .15s;
    position:relative;
  }
  .card:hover{transform:translateY(-4px);}
  .card .thumb-frame{
    width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;
    background:radial-gradient(circle at 50% 40%, rgba(255,176,32,0.16), rgba(10,19,48,0.4) 70%);
    border:1px solid rgba(255,255,255,0.1);
    margin-bottom:10px;position:relative;
  }
  .card .thumb-frame img{width:100%;height:100%;object-fit:contain;padding:10px;}
  .card h3{font-family:'Baloo 2',sans-serif;font-size:15.5px;margin:0 0 6px;line-height:1.2;}
  .card-row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;}
  .price-chip{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;
    background:linear-gradient(135deg, var(--gold), #ff8a3d);color:#241200;
    padding:3px 8px;border-radius:7px;
  }
  .stock-chip{font-size:10.5px;color:var(--text-soft);}
  .sold-stamp-sm{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);
    border:2px solid #ff4d5e;color:#ff4d5e;font-family:'Baloo 2',sans-serif;font-weight:800;
    font-size:15px;letter-spacing:0.06em;padding:2px 10px;border-radius:6px;
    background:rgba(10,19,48,0.6);
  }

  .overlay{
    position:fixed;inset:0;background:rgba(4,7,20,0.8);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--panel);border:1px solid rgba(138,92,255,0.35);
    border-radius:18px;padding:22px;width:100%;max-width:420px;
    max-height:88vh;overflow-y:auto;position:relative;
    box-shadow:0 30px 60px rgba(0,0,0,0.55);
  }
  .modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text-soft);font-size:18px;cursor:pointer;}
  .modal .photo-frame{
    width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;margin-bottom:14px;
    background:radial-gradient(circle at 50% 40%, rgba(255,176,32,0.18), rgba(10,19,48,0.4) 70%);
    border:1px solid rgba(255,255,255,0.1);position:relative;
  }
  .modal .photo-frame img{width:100%;height:100%;object-fit:contain;padding:14px;}
  .modal h2{font-family:'Baloo 2',sans-serif;font-size:22px;margin:0 0 8px;padding-right:24px;}
  .price-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
  .price{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;
    background:linear-gradient(135deg, var(--gold), #ff8a3d);color:#241200;padding:6px 12px;border-radius:8px;
  }
  .status-pill{font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(47,224,201,0.4);padding:4px 10px;border-radius:20px;}
  .status-pill.sold{color:#ff8a99;border-color:rgba(255,138,153,0.4);}
  .stock-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--gold);border:1px solid rgba(255,176,32,0.4);padding:4px 10px;border-radius:20px;}
  .desc{font-size:14px;line-height:1.6;color:var(--text-soft);white-space:pre-wrap;margin-bottom:18px;}

  .contact-stack{display:flex;flex-direction:column;gap:9px;}
  .contact-btn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:12px 16px;border-radius:12px;border:none;
    color:#fff;font-weight:700;font-size:14px;font-family:'Inter',sans-serif;cursor:pointer;text-decoration:none;transition:transform .12s;
  }
  .contact-btn:hover{transform:translateY(-1px);}
  .contact-btn svg{width:17px;height:17px;flex-shrink:0;}
  .fb-btn{background:linear-gradient(135deg,#1877f2,#0e5fd1);}
  .fb-btn svg{fill:#fff;}
  .tiktok-btn{background:linear-gradient(135deg,#25f4ee,#111 45%,#fe2c55);}
  .tiktok-btn svg{fill:#fff;}
  .gmail-btn{background:linear-gradient(135deg,#ea4335,#c5221f);}
  .gmail-btn svg{fill:#fff;}
  .no-contact{text-align:center;font-size:12px;color:var(--text-soft);border:1px dashed rgba(255,255,255,0.2);border-radius:12px;padding:12px;}
</style>

<body>

    <input type="text" id="searchInput" placeholder="Search fruits by name...">
  </div>
  <div class="search-count" id="searchCount"></div>

  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal"></div>

<script>

/* ============================================================ */

(function(){
  var DEFAULT_PHOTO = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
    '<defs><radialGradient id="g1" cx="35%" cy="30%" r="75%">' +
    '<stop offset="0%" stop-color="#ffe08a"/>' +
    '<stop offset="45%" stop-color="#ff8a3d"/>' +
    '<stop offset="100%" stop-color="#8a5cff"/>' +
    '</radialGradient></defs>' +
    '<circle cx="100" cy="108" r="72" fill="url(#g1)"/>' +
    '<path d="M100 30c6 10 4 20-2 26-8-2-14-12-8-26z" fill="#2fe0c9"/>' +
    '<path d="M60 55c14-16 34-18 46-8-2 12-16 24-30 24-8-6-14-10-16-16z" fill="#2fe0c9" opacity="0.85"/>' +
    '<g fill="#ffffff" opacity="0.85">' +
    '<circle cx="78" cy="95" r="4"/><circle cx="102" cy="82" r="4"/><circle cx="126" cy="100" r="4"/>' +
    '<circle cx="90" cy="120" r="4"/><circle cx="118" cy="128" r="4"/><circle cx="100" cy="150" r="4"/>' +
    '<circle cx="70" cy="130" r="4"/><circle cx="132" cy="130" r="4"/>' +
    '</g></svg>'
  );

  function escapeHtml(str){
    return (str||"").replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function tiktokUrl(val){
    val = (val || "").trim();
    if(!val) return "";
    if(val.indexOf('http') === 0) return val;
    var handle = val.charAt(0) === '@' ? val.slice(1) : val;
    return 'https://www.tiktok.com/@' + handle;
  }
  function isSoldOut(f){
    var stockNum = (typeof f.stock === 'number') ? f.stock : parseInt(f.stock, 10);
    return !!f.sold || (!isNaN(stockNum) && stockNum <= 0);
  }

  var grid = document.getElementById('grid');
  var searchInput = document.getElementById('searchInput');
  var searchCount = document.getElementById('searchCount');
  var currentIndices = []; // maps rendered card position -> index in FRUIT_LISTINGS

  function getFilteredIndices(){
    var q = searchInput.value.trim().toLowerCase();
    var result = [];
    FRUIT_LISTINGS.forEach(function(f, idx){
      if(!q || (f.name || '').toLowerCase().indexOf(q) !== -1){
        result.push(idx);
      }
    });
    return result;
  }

  function renderGrid(){
    grid.innerHTML = '';
    currentIndices = getFilteredIndices();
    var q = searchInput.value.trim();

    if(!FRUIT_LISTINGS.length){
      grid.innerHTML = '<div class="empty">No fruits listed yet.</div>';
      searchCount.textContent = '';
      return;
    }
    if(!currentIndices.length){
      grid.innerHTML = '<div class="empty">No fruits match "'+escapeHtml(q)+'".</div>';
      searchCount.textContent = '';
      return;
    }
    searchCount.textContent = q ? (currentIndices.length + ' result' + (currentIndices.length===1?'':'s')) : '';

    currentIndices.forEach(function(idx){
      var f = FRUIT_LISTINGS[idx];
      var sold = isSoldOut(f);
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="thumb-frame"><img src="'+(f.photo || DEFAULT_PHOTO)+'" alt="">' +
        (sold ? '<div class="sold-stamp-sm" style="font-size:10px;">OUT OF STOCK</div>' : '') + '</div>' +
        '<h3>'+escapeHtml(f.name||'Untitled Fruit')+'</h3>' +
        '<div class="card-row"><span class="price-chip">'+escapeHtml(f.price||'—')+'</span>' +
        (!sold && f.stock !== undefined && f.stock !== "" ? '<span class="stock-chip">'+escapeHtml(String(f.stock))+'x left</span>' : '') +
        '</div>';
      card.addEventListener('click', function(){ openDetail(idx); });
      grid.appendChild(card);
    });
  }

  searchInput.addEventListener('input', renderGrid);

  var detailOverlay = document.getElementById('detailOverlay');
  var detailModal = document.getElementById('detailModal');

  function openDetail(idx){
    var f = FRUIT_LISTINGS[idx];
    if(!f) return;
    var sold = isSoldOut(f);
    var stockNum = (typeof f.stock === 'number') ? f.stock : parseInt(f.stock, 10);

    var contactHtml = '';
    var any = false;
    if(f.fb){
      contactHtml += '<a class="contact-btn fb-btn" href="'+f.fb+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>Message on Facebook</a>';
      any = true;
    }
    if(f.tiktok){
      contactHtml += '<a class="contact-btn tiktok-btn" href="'+tiktokUrl(f.tiktok)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M16.6 5.2c-.9-.8-1.5-1.9-1.6-3.2h-3.2v13.6c0 1.5-1.2 2.7-2.7 2.7s-2.7-1.2-2.7-2.7 1.2-2.7 2.7-2.7c.3 0 .5 0 .8.1V9.7c-.3 0-.5-.1-.8-.1-3.2 0-5.8 2.6-5.8 5.8s2.6 5.8 5.8 5.8 5.8-2.6 5.8-5.8V9.1c1.2.9 2.7 1.4 4.3 1.4V7.3c-.9 0-1.8-.3-2.6-.8-.1 0-.1-.1-.2-.1z"/></svg>Message on TikTok</a>';
      any = true;
    }
    if(f.gmail){
      var subject = encodeURIComponent('Interested in: ' + (f.name || 'your fruit'));
      var body = encodeURIComponent('Hi, I\'m interested in "' + (f.name || 'this fruit') + '" (' + (f.price || '') + '). Is it still available?');
      contactHtml += '<a class="contact-btn gmail-btn" href="mailto:'+f.gmail+'?subject='+subject+'&body='+body+'"><svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 2-8 5-8-5h16zM4 18V7.4l8 5 8-5V18H4z"/></svg>Email on Gmail</a>';
      any = true;
    }
    if(!any) contactHtml = '<div class="no-contact">Seller hasn\'t added contact info yet.</div>';

    detailModal.innerHTML =
      '<button class="modal-close" id="detailCloseBtn">✕</button>' +
      '<div class="photo-frame"><img src="'+(f.photo || DEFAULT_PHOTO)+'" alt="">' +
      (sold ? '<div class="sold-stamp-sm" style="font-size:15px;">OUT OF STOCK</div>' : '') + '</div>' +
      '<h2>'+escapeHtml(f.name||'Untitled Fruit')+'</h2>' +
      '<div class="price-row">' +
        '<span class="price">'+escapeHtml(f.price||'—')+'</span>' +
        '<span class="status-pill'+(sold?' sold':'')+'">'+(sold?'Sold':'Available')+'</span>' +
        (!isNaN(stockNum) ? '<span class="stock-pill">Stock: '+(sold?0:stockNum)+'x</span>' : '') +
      '</div>' +
      '<div class="desc">'+escapeHtml(f.desc||'No details yet.')+'</div>' +
      '<div class="contact-stack">'+contactHtml+'</div>';

    detailOverlay.classList.add('show');
    document.getElementById('detailCloseBtn').addEventListener('click', closeDetail);
  }
  function closeDetail(){ detailOverlay.classList.remove('show'); }
  detailOverlay.addEventListener('click', function(e){ if(e.target === detailOverlay) closeDetail(); });

  renderGrid();
})();
</script>
